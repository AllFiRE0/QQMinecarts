messages:
  prefix: "&8[&bQQMinecarts&8] &r"
  no-permission: "&cYou don't have permission to do that."
  only-player: "&cThis command can only be used by a player."
  wrong-usage: "&cUsage: &6/&bqqm&f reload"
  reloading: "&eReloading configuration..."
  reloaded: "&aConfiguration reloaded successfully."
  reload-failed: "&cFailed to reload configuration. See console."
  disabled-world: "&cQQMinecarts minecart mechanics are disabled in this world."
