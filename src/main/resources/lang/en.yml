# English language files for QQMinecarts
# You can use color codes: &0-&f, also &x&... (HEX)
# By default all chat messages are empty ("") — they are NOT sent (no spam).
# To enable a message, put its text instead of "" (example above the key).
messages:
  prefix: "&8[&bQQMinecarts&8] &r"
  # Example: "&cYou don't have permission to use QQMinecarts minecarts."
  no-permission: ""
  # Example: "&cThis command can only be used by a player."
  only-player: ""
  # Example: "&cUsage: &6/&bqqm&f reload"
  wrong-usage: ""
  # Example: "&eReloading configuration..."
  reloading: ""
  # Example: "&aConfiguration reloaded successfully."
  reloaded: ""
  # Example: "&cFailed to reload configuration. See console."
  reload-failed: ""
  # Example: "&cQQMinecarts minecart mechanics are disabled in this world."
  disabled-world: ""
  # Example: "&bMinecart speed: &6level {level} &7(+{speed})"
  boost: ""
  # Example: "&6Maximum speed reached."
  boost-max: ""
  # Example: "&aMinecart speed reset to normal."
  boost-reset: ""
  # Example: "&cMinecart stopped."
  boost-stopped: ""
  actionbar: "&7Level &f{level} &8| &7speed &f{boost} &8| &7km/h &f{kmh}"
  bossbar-title: "Minecart speed (level {level}): {boost} &8| &7{kmh} km/h"
  level-default: "normal"
  # Example: "&b{animal} speed: &6level {level} &7(+{speed})"
  riding-boost: ""
  # Example: "&6Maximum speed reached."
  riding-boost-max: ""
  # Example: "&aRide speed reset to normal."
  riding-boost-reset: ""
  riding-actionbar: "&7Level &f{level} &8| &7{animal} &8| &7speed &f{boost} &8| &7km/h &f{kmh}"
  # Mob names for {animal} in the ride actionbar/messages.
  # You can color them with '&'. If missing, the raw English key is shown.
  mobs:
    horse: "horse"
    donkey: "donkey"
    mule: "mule"
    skeleton-horse: "skeleton horse"
    zombie-horse: "zombie horse"
    pig: "pig"
    strider: "strider"
    camel: "camel"
    camel-husk: "camel husk"
    llama: "llama"
    trader-llama: "trader llama"
    happy-ghast: "happy ghast"
    nautilus: "nautilus"
    zombie-nautilus: "zombie nautilus"