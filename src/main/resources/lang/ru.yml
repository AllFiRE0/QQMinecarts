# Русский язык сообщений QQMinecarts
# Можно использовать цветовые коды: &0-&f, а также &x&... (HEX)
# По умолчанию все чат-сообщения пустые ("") — они НЕ отправляются (нет спама).
# Чтобы включить сообщение, впишите его текст (пример — в комментарии выше).
messages:
  prefix: "&8[&bQQMinecarts&8] &r"
  # Пример: "&cУ вас нет прав на использование вагонеток QQMinecarts."
  no-permission: ""
  # Пример: "&cЭта команда доступна только игроку."
  only-player: ""
  # Пример: "&cИспользование: &6/&bqqm&f reload"
  wrong-usage: ""
  # Пример: "&eПерезагрузка конфигурации..."
  reloading: ""
  # Пример: "&aКонфигурация успешно перезагружена."
  reloaded: ""
  # Пример: "&cНе удалось перезагрузить конфигурацию. Смотрите консоль."
  reload-failed: ""
  # Пример: "&cВ этом мире механики вагонеток QQMinecarts отключены."
  disabled-world: ""
  # Пример: "&bСкорость вагонетки: &6уровень {level} &7(+{speed})"
  boost: ""
  # Пример: "&6Уже максимальная скорость."
  boost-max: ""
  # Пример: "&aСкорость вагонетки сброшена (обычная)."
  boost-reset: ""
  # Пример: "&cВагонетка остановлена."
  boost-stopped: ""
  actionbar: "&7Уровень &f{level} &8| &7скорость &f{boost} &8| &7км/ч &f{kmh}"
  bossbar-title: "Скорость вагонетки (ур. {level}): {boost} &8| &7{kmh} км/ч"
  level-default: "обычная"
  # Пример: "&b{animal}: &6уровень {level} &7(+{speed})"
  riding-boost: ""
  # Пример: "&6Уже максимальная скорость."
  riding-boost-max: ""
  # Пример: "&aСкорость животного сброшена (обычная)."
  riding-boost-reset: ""
  riding-actionbar: "&7Уровень &f{level} &8| &7{animal} &8| &7скорость &f{boost} &8| &7км/ч &f{kmh}"
  # Имена мобов для {animal} в экшнбаре/сообщениях езды.
  # Можно красить через '&'. Если перевода нет — покажется английский ключ.
  mobs:
    horse: "лошадь"
    donkey: "осёл"
    mule: "мул"
    skeleton-horse: "скелето-лошадь"
    zombie-horse: "зомби-лошадь"
    pig: "свинья"
    strider: "страйдер"
    camel: "верблюд"
    camel-husk: "верблюд-кадавр"
    llama: "лама"
    trader-llama: "лама-торговец"
    happy-ghast: "счастливый гаст"
    nautilus: "наутилус"
    zombie-nautilus: "зомби-наутилус"