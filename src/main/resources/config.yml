# =====================================================================
#  QQMinecarts — конфигурация
#  Плагин для Paper/Leaf 1.21.11 – 26.3 и новых версий.
#  После изменения файла выполните: /qqm reload
# =====================================================================

# Режим отладки: подробные сообщения в консоль (true/false)
debug: false

# Языковой файл сообщений: ru или en (лежат в папке lang/ плагина)
language: ru

# ---------------------------------------------------------------------
#  УРОВНИ СКОРОСТИ
#  Описание ниже — для режима mechanic.mode: manual (по умолчанию).
#  В режиме auto уровни набираются временем, см. секцию "mechanic".
#  Клавиша F, сидя в вагонетке, повышает уровень на один шаг
#  (1 -> 2 -> ... -> max). Плагин поднимает максимальную скорость рельс
#  на значение уровня, ПРИБАВЛЯЯ его к базовой скорости вагонетки
#  (итог = базовая скорость + уровень). База берётся из самой вагонетки
#  при привязке; на Purpur/Leaf это значение из
#  purpur.yml: gameplay-mechanics.minecart.max-speed.
#  speed-levels            — обычные рельсы (и земля/прочее);
#  powered-speed-levels    — ЭНЕРГОРЕЛЬСЫ (отдельная настройка; если
#                            секции нет — берутся speed-levels).
#  Движение полностью ванильное:
#   - вагонетка едет туда, куда она разгоняется клавишами вперёд/назад
#     (по взгляду игрока), и НЕ едет сама по себе;
#   - на энергорельсах до нового лимита разгоняет сама рельса;
#   - на обычных рельсах до него разгоняет удержание "вперёд";
#   - на земле (не на рельсах) скорость/разгон не применяются.
#  Пробел (клавиша прыжка):
#   - на обычных рельсах — сброс скорости до обычной;
#   - на энергорельсах — полная остановка вагонетки (энергорельсы в
#     ванилле не позволяют остановиться, поэтому плагин останавливает
#     тележку принудительно).
# ---------------------------------------------------------------------
# Обычные рельсы
speed-levels:
  '1': 0.4
  '2': 0.7
  '3': 1.0
  '4': 1.3
  '5': 1.6

# Энергорельсы (можно сделать быстрее — рельсы сами разгоняют)
powered-speed-levels:
  '1': 0.6
  '2': 1.0
  '3': 1.4
  '4': 1.8
  '5': 2.2

# ---------------------------------------------------------------------
#  ПОВОРОТЫ (защита от вылета с рельс)
#  Максимальная скорость (блоки/тик), до которой притормаживается
#  вагонетка перед поворотом и на самом повороте. Если вагонетка едет
#  быстрее — плагин плавно подрезает её скорость до этого значения,
#  иначе на высокой скорости она слетает с рельс.
#  0 = не ограничивать на поворотах (риск вылета).
# ---------------------------------------------------------------------
curve-max-speed: 0.7

# ---------------------------------------------------------------------
#  ПЛАВНЫЙ РАЗГОН / ТОРМОЖЕНИЕ
#  Скорость меняется НЕ мгновенно, а за указанное число тиков.
#  20 тиков = 1 секунда.
# ---------------------------------------------------------------------
transition:
  # Пауза (в тиках) ПОСЛЕ клика, прежде чем скорость начнёт меняться.
  # 0 = реагирует сразу.
  delay-ticks: 0
  # За сколько тиков скорость доезжает до выбранного уровня.
  ramp-ticks: 40

# ---------------------------------------------------------------------
#  СБРОС КЛАВИШЕЙ ПРЫЖКА (ПРОБЕЛ)
#  true  — пробел сбрасывает скорость к обычной (ванильной);
#  false — пробел ничего не делает, сброс только при выходе из вагонетки.
# ---------------------------------------------------------------------
space-reset: true

# ---------------------------------------------------------------------
#  КАК ПОВЫШАТЬ УРОВЕНЬ
#  SWAP — клавиша F (единственный триггер; ЛКМ свободен для ударов/
#  разрушения блоков и не используется плагином).
# ---------------------------------------------------------------------
cycle-triggers:
  - SWAP

# Анти-спам: минимальный интервал между кликами (в мс).
# Защищает от двойного срабатывания одного клика.
click-cooldown-ms: 300

# ---------------------------------------------------------------------
#  РЕЖИМ УПРАВЛЕНИЯ СКОРОСТЬЮ
#  manual — вручную (по умолчанию): клавиша F повышает уровень на 1 шаг,
#           пробел сбрасывает до обычной.
#  auto   — автоматически: активная езда (удержание W/S в вагонетке,
#           прямая езда по земле на мобе) разгоняет транспорт на 1 уровень
#           каждые accel-tick-interval; как только разгон прекратился —
#           вагонетка остановилась / отпустил W/S / моб упёрся в стену,
#           плывёт, падает с обрыва или поворачивается — скорость
#           сбрасывается на 1 уровень каждые N тиков (интервалы у вагонетки
#           и моба разные, см. ниже). В режиме auto клавиша F НЕ используется
#           (предметы свободно меняются местами), пробел по-прежнему сбрасывает.
# ---------------------------------------------------------------------
mechanic:
  # Режим: manual | auto
  mode: manual
  auto:
    # Через сколько тиков активной езды прибавляется 1 уровень скорости.
    # 20 тиков = 1 секунда. Шаг прибавки = ПЕРВЫЙ уровень speed-levels
    # (вагонетка) / speed-levels животного. Максимум — последний уровень.
    accel-tick-interval: 80
    # Тиков на -1 уровень, когда вагонетка остановилась (не жмётся W/S
    # или тележка упёрлась). По умолчанию 40 тиков (2 секунды).
    decel-minecart-tick-interval: 40
    # Тиков на -1 уровень, когда моб не "скачет" (стоит/упёрся в стену,
    # плывёт по воде, падает с обрыва или поворачивается). 20 тиков = 1 сек.
    decel-mob-tick-interval: 20

# ---------------------------------------------------------------------
#  ОТОБРАЖЕНИЕ ТЕКУЩЕГО УРОВНЯ И СКОРОСТИ
#  Показывается, пока игрок сидит в вагонетке.
# ---------------------------------------------------------------------
display:
  # Способ отображения: ACTIONBAR (сообщение над хотбаром) или BOSSBAR.
  type: ACTIONBAR
  # Как часто обновлять отображение (в тиках).
  update-interval-ticks: 10
  # Показывать всегда? если false — только когда прибавка не нулевая.
  show-always: true
  # Настройки боссбара (используются при type: BOSSBAR)
  bossbar:
    # Цвет: BLUE, GREEN, RED, YELLOW, PURPLE, WHITE, PINK
    color: BLUE
    # Стиль: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SEGMENTED_10
    # Прибавка, при которой полоса заполнена на 100%.
    full-progress-at: 4.0

# ---------------------------------------------------------------------
#  МИРЫ-ИСКЛЮЧЕНИЯ
#  Миры, в которых механики плагина полностью отключены (ванильное поведение).
#  Игрок с правом qqminecarts.bypass ездит с механиками в любом мире.
# ---------------------------------------------------------------------
disabled-worlds: []

# ---------------------------------------------------------------------
#  ЕЗДА ВЕРХОМ НА ЖИВОТНЫХ
#  Лошади, ослы, мулы, скелетон-лошади, зомби-лошади, свиньи, страйдеры,
#  верблюды, верблюды-кадавры, ламы (и ламы-торговца), счастливые гасты,
#  наутилусы (и зомби-наутилусы).
#  У каждого животного своя секция: включение (enabled) и СВОИ скорости.
#  Клавиша F — следующий уровень (1 -> ... -> max), пробел — сброс к обычной.
#  Плагин НЕ переопределяет движение: пока игрок ВЕДЁТ животное (клавиша W),
#  оно само разгоняется; плагин постепенно поднимает ЕГО максимальную скорость
#  до «базовая скорость животного + уровень».
#  Скорости указываются в блоках/тик (как атрибут movement speed у животного,
#  НЕ км/ч). Пример: при среднем коне (0.22) и 5-м уровне (+0.25) итог = 0.47.
#  ВАЖНО: «база» — это индивидуальное значение именно ЭТОГО животного:
#  у лошадей скорость при спавне случайна в диапазоне (прим. 0.1125–0.3375),
#  у каждой лошади она своя. Уровень ПРИБАВЛЯЕТСЯ к этой индивидуальной базе,
#  поэтому одна и та же прибавка у «медленной» и «быстрой» лошади даёт разный
#  итог. Текущее индивидуальное значение смотрите плейсхолдером
#  %qqminecarts_base_max_speed% («базовая макс. скорость»).
# ---------------------------------------------------------------------
riding:
  horse:
