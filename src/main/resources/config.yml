# ---------------------------------------------------------------------
#  ПЛЕЙСХОЛДЕРЫ PLACEHOLDERAPI (префикс: qqminecarts)
#  Нужен установленный Plugin PlaceholderAPI. Пример использования в TAB:
#    %qqminecarts_riding%          едет ли игрок верхом на животном  (yes/no)
#    %qqminecarts_minecart%        едет ли игрок в вагонетке          (yes/no)
#    %qqminecarts_player_speed%    текущая скорость игрока, км/ч      (целое, напр. 0, 1, 100, 1297)
#    %qqminecarts_selected_level%  выбранный уровень скорости         (0 = обычная)
#    %qqminecarts_level_boost%     прибавка выбранного уровня         (блоков/тик, напр. 0.50)
#    %qqminecarts_base_max_speed%  базовая максимальная скорость транспорта
#                                  (вагонетка: как в purpur.yml max-speed;
#                                   животное: реальный атрибут скорости,
#                                   напр. скорость конкретной приручённой лошади)
# ---------------------------------------------------------------------