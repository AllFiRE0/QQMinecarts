# =====================================================================
#  QQMinecarts — конфигурация
#  Плагин для Paper/Leaf 1.21.11 – 26.3 и новых версий.
#  После изменения файла выполните: /qqm reload (перезагрузка проходит
#  в фоновом потоке, сервер не тормозит).
# =====================================================================

# Режим отладки: подробные сообщения в консоль (true/false)
debug: false

# Языковой файл сообщений: ru или en (лежат в папке lang/ плагина)
language: ru

# ---------------------------------------------------------------------
#  УРОВНИ СКОРОСТИ
#  Каждый уровень задаёт скорость вагонетки (блоков в тик).
#
#  Уровень 'default' — обычное (ванильное) управление:
#    * зажата W  — вагонетка едет вперёд со скоростью manual.forward-speed
#    * отпущена W — вагонетка останавливается
#
#  Уровни '1', '2', '3' ... — автономный режим: вагонетка едет сама
#  с указанной скоростью и не зависит от нажатых клавиш.
#
#  Можно добавлять свои уровни: 6: 1.9, 7: 2.2 и так далее.
#  Переключение идёт по кругу: default -> 1 -> 2 -> ... -> max -> default.
# ---------------------------------------------------------------------
speed-levels:
  default: 0.0
  '1': 0.4
  '2': 0.7
  '3': 1.0
  '4': 1.3
  '5': 1.6

# ---------------------------------------------------------------------
#  КАК ПЕРЕКЛЮЧАТЬ СКОРОСТЬ
#  Доступные триггеры:
#    SWAP        — клавиша F (предмет в руках меняться не будет)
#    LEFT_CLICK  — ЛКМ в воздухе (взмах рукой; по сущности не сработает)
# ---------------------------------------------------------------------
cycle-triggers:
  - SWAP
  - LEFT_CLICK

# ---------------------------------------------------------------------
#  ПЛАВНЫЙ РАЗГОН / ТОРМОЖЕНИЕ
#  Скорость меняется НЕ мгновенно, а пошагово.
# ---------------------------------------------------------------------
transition:
  # Задержка (в тиках) ПОСЛЕ выбора нового уровня, прежде чем скорость
  # начнёт меняться. 20 тиков = 1 секунда. Например, 60 = 3 секунды.
  delay-ticks: 60
  # Насколько изменяется скорость за один шаг (например, 0.10).
  step: 0.10
  # Через сколько тиков выполняется следующий шаг изменения скорости.
  interval-ticks: 5

# ---------------------------------------------------------------------
#  РУЧНОЕ УПРАВЛЕНИЕ (уровень 'default')
# ---------------------------------------------------------------------
manual:
  # Скорость, до которой вагонетка разгоняется при зажатой W.
  forward-speed: 0.4

# ---------------------------------------------------------------------
#  ОТОБРАЖЕНИЕ ТЕКУЩЕЙ СКОРОСТИ
#  Показывается, пока игрок сидит в вагонетке.
# ---------------------------------------------------------------------
display:
  # Способ отображения: ACTIONBAR (сообщение над хотбаром) или BOSSBAR.
  type: ACTIONBAR
  # Как часто обновлять отображение (в тиках).
  update-interval-ticks: 10
  # Показывать всегда? если false — только во время разгона/торможения.
  show-always: true
  # Настройки боссбара (используются при type: BOSSBAR)
  bossbar:
    # Цвет: BLUE, GREEN, RED, YELLOW, PURPLE, WHITE, PINK
    color: BLUE
    # Стиль: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SEGMENTED_10
    # Скорость, при которой полоса заполнена на 100%.
    full-progress-at: 2.0

# ---------------------------------------------------------------------
#  МИРЫ-ИСКЛЮЧЕНИЯ
#  Миры, в которых механики плагина полностью отключены (ванильное поведение).
#  Игрок с правом qqminecarts.bypass ездит с механиками в любом мире.
# ---------------------------------------------------------------------
disabled-worlds: []

# Требовать отдельное право (qqminecarts.speed.<уровень>) на каждый уровень
# выше 'default'? Например: qqminecarts.speed.3
permission-per-level: false