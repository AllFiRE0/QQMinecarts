name: QQMinecarts
version: '1.1.0'
main: dev.qm.qqminecarts.QQMinecarts
api-version: '1.21.11'
folia-supported: true
description: "Быстрые вагонетки и езда верхом: режим manual (F = уровень, пробел = сброс) или auto (разгон временем, поворот снимает скорость). Плейсхолдеры qqminecarts_* через PlaceholderAPI."
website: https://github.com/AllF1RE
author: AllF1RE
softdepend:
  - PlaceholderAPI

commands:
  qqm:
    description: Основная команда QQMinecarts
    aliases: [ qqminecarts, qmc ]
    usage: /qqm reload
    permission: qqminecarts.use

permissions:
  qqminecarts.use:
    description: Доступ к механикам вагонеток
    default: true
  qqminecarts.bypass:
    description: Игнорировать disabled-worlds (механики работают в любых мирах)
    default: false
  qqminecarts.reload:
    description: Перезагрузка конфигурации (/qqm reload)
    default: op
  qqminecarts.admin:
    description: Полный доступ к администрированию плагина
    default: op
    children:
      qqminecarts.reload: true